[package]
name = "poker"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }